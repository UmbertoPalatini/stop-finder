[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stopfinder"
dynamic = ["version"]
description = "Termination codons in female-specific (sex-specifically spliced) exons"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Umberto Palatini"}]
requires-python = ">=3.9"
dependencies = ["biopython>=1.79"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3"]
test = ["pytest"]

[project.scripts]
stopfinder = "stopfinder.cli:main"

[project.urls]
Repository = "https://github.com/UmbertoPalatini/stop-finder"

[tool.setuptools.dynamic]
version = {attr = "stopfinder.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
